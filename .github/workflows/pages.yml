name: Deploy TikTok LIVE Arena to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and Web export templates
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: true

      - name: Import project resources
        run: godot --headless --path . --editor --quit

      - name: Run combat and integration tests
        run: godot --headless --path . --scene res://test/test_suite.tscn

      - name: Export current game for the web
        run: |
          mkdir -p dist
          godot --headless --path . --export-release "Web" dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload built game
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
