<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="manus-game-loading-screen" content="1">
  <title>TikTok LIVE Arena</title>
  $GODOT_HEAD_INCLUDE
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background:#070b18; color:#f4f7ff; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:#070b18; overflow:hidden; }
    body { min-height:100vh; display:grid; place-items:center; }
    canvas { position:fixed; inset:0; width:100%; height:100%; outline:none; }
    #loading { position:relative; z-index:2; width:min(640px, calc(100vw - 40px)); padding:42px 38px; border:1px solid #55dcff66; border-radius:22px; background:linear-gradient(145deg,#111a2df2,#080d1bef); box-shadow:0 24px 90px #0009, 0 0 80px #1b7fff22; text-align:center; }
    .eyebrow { color:#55dcff; letter-spacing:.22em; font-size:12px; font-weight:700; }
    h1 { margin:14px 0 6px; font-size:clamp(30px,7vw,62px); line-height:.92; letter-spacing:.03em; text-shadow:0 4px 0 #151f44, 0 0 28px #55dcff55; }
    p { color:#a5b3ce; margin:12px 0 24px; }
    progress { width:100%; height:9px; accent-color:#55dcff; }
    #loading-status { color:#ffc857; font-weight:700; margin:16px 0 8px; }
    #loading-notice { font-size:12px; margin:12px 0; }
    button { min-height:44px; padding:0 18px; border:1px solid #55dcff99; border-radius:9px; background:#17233b; color:#f4f7ff; cursor:pointer; }
    button:focus-visible { outline:3px solid #ffc857; outline-offset:3px; }
    [hidden] { display:none !important; }
    @media (max-aspect-ratio:1/1) { #loading { padding:30px 24px; } }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0">Seu navegador não suporta canvas.</canvas>
  <section id="loading" role="status" aria-live="polite">
    <div class="eyebrow">ARENA DE BATALHA • LIVE INTERACTIVE</div>
    <h1>TIKTOK LIVE<br>ARENA</h1>
    <p>Preparando a arena, os lutadores originais e o sistema de torcida.</p>
    <progress id="loading-progress" aria-label="Progresso do download"></progress>
    <div id="loading-status">Carregando…</div>
    <p id="loading-notice" hidden></p>
    <button id="loading-retry" type="button" hidden>Recarregar arena</button>
    <noscript>JavaScript é necessário para jogar.</noscript>
  </section>
  <script>
    (() => {
      const config = $GODOT_CONFIG;
      const threads = $GODOT_THREADS_ENABLED;
      const canvas = document.getElementById('canvas');
      const loading = document.getElementById('loading');
      const status = document.getElementById('loading-status');
      const progress = document.getElementById('loading-progress');
      const notice = document.getElementById('loading-notice');
      const retry = document.getElementById('loading-retry');
      retry.addEventListener('click', () => window.location.reload());
      let failed = false;
      let ready = false;
      let lastProgress = performance.now();
      const fail = (error) => {
        if (failed || ready) return;
        failed = true;
        console.error('[game-loading] startup failed', error);
        status.textContent = 'Não foi possível carregar a arena.';
        notice.hidden = false;
        notice.textContent = 'Verifique o navegador e tente novamente.';
        progress.hidden = true;
        retry.hidden = false;
      };
      window.addEventListener('error', (event) => fail(event.error || new Error('startup error')));
      window.addEventListener('unhandledrejection', (event) => fail(event.reason || new Error('startup rejection')));
      const onProgress = (current, total) => {
        if (failed || ready) return;
        if (Number.isFinite(current)) lastProgress = performance.now();
        if (!Number.isFinite(total) || total <= 0) { progress.removeAttribute('value'); return; }
        progress.max = total;
        progress.value = Math.min(current, total);
        status.textContent = current >= total ? 'Inicializando combate…' : `${Math.floor(current / total * 100)}%`;
        if (performance.now() - lastProgress > 30000) { notice.hidden = false; notice.textContent = 'A arena ainda está carregando. Você pode aguardar ou recarregar.'; retry.hidden = false; }
      };
      const start = async () => {
        try {
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Missing browser features: ${missing.join(', ')}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          ready = true;
          requestAnimationFrame(() => requestAnimationFrame(() => { loading.hidden = true; if (config['focusCanvas']) canvas.focus(); }));
        } catch (error) { fail(error); }
      };
      const script = document.createElement('script');
      script.src = '$GODOT_URL';
      script.addEventListener('load', start, { once:true });
      script.addEventListener('error', () => fail(new Error('engine script could not be loaded')), { once:true });
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
